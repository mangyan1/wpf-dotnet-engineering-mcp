version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - "/"
      - "/installer"
      - "/src/*"
      - "/tests/*"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dotnet-minor-patch:
        group-by: dependency-name
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      dotnet-major:
        group-by: dependency-name
        patterns:
          - "*"
        update-types:
          - major

  - package-ecosystem: npm
    directory: "/vscode-extension"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      extension-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
