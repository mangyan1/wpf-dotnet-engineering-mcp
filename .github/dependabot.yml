version: 2
# NuGet updates are intentionally not configured here: Dependabot's lock-file
# regeneration runs a plain restore and strips the win-x64 runtime sections from
# packages.lock.json, which our locked-mode `--runtime win-x64` restore rejects
# (NU1004). NuGet versions are bumped manually via the documented locked-restore
# protocol; the NuGet advisory gate and dependency review still apply to all PRs.
updates:
  - package-ecosystem: npm
    directory: "/vscode-extension"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      extension-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
