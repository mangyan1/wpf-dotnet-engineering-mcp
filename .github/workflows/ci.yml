name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-validation:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore DotNetEngineeringMcp.sln --locked-mode
      - name: Build
        run: dotnet build DotNetEngineeringMcp.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test DotNetEngineeringMcp.sln --configuration Release --no-build --logger "trx;LogFileName=tests.trx"
      - name: Static contract checks
        run: python scripts/self-test-static.py
      - name: Vulnerable dependency gate
        shell: pwsh
        run: |
          $output = dotnet list DotNetEngineeringMcp.sln package --vulnerable --include-transitive
          $output | Write-Host
          if ($LASTEXITCODE -ne 0 -or ($output -join "`n") -match "has the following vulnerable packages") { throw "Vulnerable dependency gate failed." }
      - name: Package and generate SPDX SBOM/checksums
        shell: pwsh
        run: ./build/release-hardening.ps1 -Configuration Release
      - uses: actions/upload-artifact@v4
        with:
          name: engineering-mcp-release-unsigned
          path: artifacts/release
          if-no-files-found: error
