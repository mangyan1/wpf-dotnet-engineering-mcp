name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Windows .NET 10 validation
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked dependencies
        run: dotnet restore DotNetEngineeringMcp.sln --runtime win-x64 --locked-mode

      - name: Restore locked installer dependencies
        run: dotnet restore installer/EngineeringMcp.Installer.wixproj --locked-mode

      - name: Reject known NuGet vulnerabilities
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/Test-NuGetVulnerabilities.ps1

      - name: Build release configuration
        run: dotnet build DotNetEngineeringMcp.sln --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test DotNetEngineeringMcp.sln --configuration Release --no-build --no-restore --logger "console;verbosity=minimal"

      - name: Run static security and contract gates
        run: python scripts/self-test-static.py

      - name: Run sanitized secret scan
        shell: bash
        run: bash scripts/verify-no-secrets.sh
